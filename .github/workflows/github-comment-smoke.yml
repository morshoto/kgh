name: GitHub Comment Smoke

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read

jobs:
    smoke:
        name: Smoke
        runs-on: ubuntu-latest
        if: github.event.pull_request.head.repo.full_name == github.repository
        permissions:
            contents: read
            issues: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: false

            - name: Run GitHub comment smoke test
              shell: bash
              env:
                  KGH_GITHUB_COMMENT_SMOKE: "1"
                  GITHUB_TOKEN: ${{ github.token }}
              run: go test -tags smoke ./internal/github -run '^TestSmokePRCommentUpsertLive$' -count=1
